{% extends 'base.html' %}

{% block title %}Авторизация{% endblock %}

{% block content %}
<div class="container">
    <h4 class="text-center mt-5 mb-5">Введите данные для входа:</h4>
    <form method="post" enctype="multipart/form-data">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit" class="btn btn-primary">Войти</button>
    </form>
</div>
{% endblock %}
