{% extends 'base.html' %}

{% block title %}Skystore{% endblock %}

{% block content %}
<h4 class="text-center mt-5 mb-5">Удалить продукт {{product.name}}?</h4>
<div class="container text-center">
    <form method="post" enctype="multipart/form-data">
        {% csrf_token %}
    <button type="submit" class="btn btn-danger">Удалить</button>
    <a href="{% url 'catalog:home' %}" class="btn btn-secondary">Отмена</a>
    </form>
</div>
{% endblock %}
